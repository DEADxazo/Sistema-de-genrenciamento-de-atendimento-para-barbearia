<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker>
 <marker id="triangle" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="white" stroke="#333" stroke-width="1.5"/></marker>
 <style>.box{fill:white;stroke:#222;stroke-width:2}.head{fill:#e9eef5;stroke:#222;stroke-width:2}.title{font:bold 22px Arial;fill:#111}.text{font:16px Arial;fill:#222}.small{font:italic 14px Arial;fill:#555}.line{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}.inherit{stroke:#333;stroke-width:2;fill:white;marker-end:url(#triangle)}</style>
</defs>
<rect x="0" y="0" width="1200" height="900" fill="#fff"/>
<text x="600" y="42" text-anchor="middle" style="font:bold 30px Arial;fill:#111">Diagrama de Classes — Sistema de Atendimento para Barbearia</text>
<text x="600" y="70" text-anchor="middle" class="small">Baseado nas classes implementadas no projeto POO em Python</text>
<rect class="head" x="450" y="105" width="300" height="55" rx="4"/><rect class="box" x="450" y="160" width="300" height="145"/>
<text class="title" x="600" y="140" text-anchor="middle">Pessoa &lt;&lt;abstract&gt;&gt;</text><text class="text" x="470" y="190">- _nome</text><text class="text" x="470" y="216">- _telefone</text><line x1="450" y1="230" x2="750" y2="230" stroke="#222"/><text class="text" x="470" y="257">+ nome (property)</text><text class="text" x="470" y="282">+ telefone (property)</text><text class="text" x="470" y="302">+ exibir_dados() {abstract}</text>
<rect class="head" x="100" y="360" width="300" height="55"/><rect class="box" x="100" y="415" width="300" height="120"/><text class="title" x="250" y="395" text-anchor="middle">Cliente</text><text class="text" x="120" y="445">- fidelidade</text><line x1="100" y1="460" x2="400" y2="460" stroke="#222"/><text class="text" x="120" y="487">+ exibir_dados()</text><text class="text" x="120" y="512">+ __init__(nome, telefone, fidelidade)</text>
<rect class="head" x="800" y="360" width="300" height="55"/><rect class="box" x="800" y="415" width="300" height="120"/><text class="title" x="950" y="395" text-anchor="middle">Barbeiro</text><text class="text" x="820" y="445">- especialidade</text><line x1="800" y1="460" x2="1100" y2="460" stroke="#222"/><text class="text" x="820" y="487">+ exibir_dados()</text><text class="text" x="820" y="512">+ __init__(nome, telefone, especialidade)</text>
<line class="inherit" x1="250" y1="360" x2="540" y2="305"/><line class="inherit" x1="950" y1="360" x2="660" y2="305"/>
<rect class="head" x="100" y="640" width="300" height="55"/><rect class="box" x="100" y="695" width="300" height="140"/><text class="title" x="250" y="675" text-anchor="middle">Servico</text><text class="text" x="120" y="725">- descricao</text><text class="text" x="120" y="750">- preco</text><text class="text" x="120" y="775">- duracao_min</text><line x1="100" y1="790" x2="400" y2="790" stroke="#222"/><text class="text" x="120" y="818">+ exibir_servico()</text>
<rect class="head" x="450" y="555" width="300" height="55"/><rect class="box" x="450" y="610" width="300" height="180"/><text class="title" x="600" y="590" text-anchor="middle">Agendamento</text><text class="text" x="470" y="640">- cliente : Cliente</text><text class="text" x="470" y="665">- barbeiro : Barbeiro</text><text class="text" x="470" y="690">- servico : Servico</text><text class="text" x="470" y="715">- data_hora : datetime</text><line x1="450" y1="730" x2="750" y2="730" stroke="#222"/><text class="text" x="470" y="758">+ resumo_atendimento()</text><text class="text" x="470" y="782">+ __init__(cliente, barbeiro, servico, data_hora)</text>
<line class="line" x1="400" y1="475" x2="450" y2="650"/><line class="line" x1="800" y1="475" x2="750" y2="675"/><line class="line" x1="400" y1="735" x2="450" y2="700"/><text class="small" x="405" y="570">cliente</text><text class="small" x="755" y="570">barbeiro</text><text class="small" x="390" y="700">servico</text>
<text x="600" y="865" text-anchor="middle" class="small">Herança: Cliente e Barbeiro → Pessoa | Associação: Agendamento mantém referências de Cliente, Barbeiro e Servico</text>
</svg>